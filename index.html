<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="dialog__container">
        <!-- Modal at the beginning -->
        <dialog class="dialog__start" open>
          <form id="form" class="dialog__start__form" method="dialog">
            <h2 class="dialog__start__header">Start New Game</h2>
            <label for="p1">Player 1's Name:</label>
            <input type="text" id="p1" placeholder="Player One" required>
            <label for="p2">Player 2's Name:</label>
            <input type="text" id="p2" placeholder="Player Two" required>
            <button>Start Game</button>
          </form>
        </dialog>

        <!-- Modal for resetting; When someone wins the round -->
        <dialog class="dialog__reset">
            <form id="form" class="dialog__reset__form" method="dialog">
                <h2 class="dialog__reset__header"></h2>
                <button>Play Again</button>
                </form>
        </dialog>
    </div>

    <div class="container">
        <h2 class="player-turn"></h2>
        <div class="game">
            <div class="box" data-position="0">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="1">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="2">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="3">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="4">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="5">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="6">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="7">
                <img src="#" alt="">
            </div>
            <div class="box" data-position="8"> 
                <img src="#" alt="">
            </div>
        </div>

        <div class="controls">
            <button class="restart-btn">Restart Game</button>
        </div>
    </div>

    <script type="module" src="/script/main.js"></script>
</body>
</html>
